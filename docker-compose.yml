version: '3.9'

services:
  # ============================================================
  # DATABASE — PostgreSQL
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: ibs_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-internet_banking}
      POSTGRES_USER: ${DB_USER:-bank_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-BankAdmin@2024}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bank_admin} -d ${DB_NAME:-internet_banking}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ibs_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # CACHE + BROKER — Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: ibs_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ibs_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # BACKEND — Django API
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ibs_backend
    restart: unless-stopped
    command: sh /app/entrypoint.sh
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_static:/app/staticfiles
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DB_NAME=${DB_NAME:-internet_banking}
      - DB_USER=${DB_USER:-bank_admin}
      - DB_PASSWORD=${DB_PASSWORD:-BankAdmin@2024}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/2
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - AI_SERVICE_URL=http://ai-service:9000
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:80,http://localhost
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - SMS_PROVIDER=${SMS_PROVIDER:-console}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ibs_network

  # ============================================================
  # CELERY WORKER — Background tasks
  # ============================================================
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ibs_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=2
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_logs:/app/logs
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DB_NAME=${DB_NAME:-internet_banking}
      - DB_USER=${DB_USER:-bank_admin}
      - DB_PASSWORD=${DB_PASSWORD:-BankAdmin@2024}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/2
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - AI_SERVICE_URL=http://ai-service:9000
    depends_on:
      - backend
      - redis
    networks:
      - ibs_network

  # ============================================================
  # CELERY BEAT — Scheduled tasks
  # ============================================================
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ibs_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DB_NAME=${DB_NAME:-internet_banking}
      - DB_USER=${DB_USER:-bank_admin}
      - DB_PASSWORD=${DB_PASSWORD:-BankAdmin@2024}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/2
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - backend
      - redis
    networks:
      - ibs_network

  # ============================================================
  # AI SERVICE — FastAPI
  # ============================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ibs_ai_service
    restart: unless-stopped
    command: uvicorn app:app --host 0.0.0.0 --port 9000
    volumes:
      - ./ai-service:/app
      - ai_models:/app/models
    ports:
      - "9000:9000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - CHATBOT_MAX_TOKENS=800
      - DJANGO_API_URL=http://backend:8000/api
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - ibs_network

  # ============================================================
  # FRONTEND — React (dev mode with hot reload)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${FRONTEND_TARGET:-development}
    container_name: ibs_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000/api}
      - WDS_SOCKET_PORT=0
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - ibs_network

  # ============================================================
  # NGINX — Reverse proxy (optional for prod)
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: ibs_nginx
    restart: unless-stopped
    profiles:
      - prod
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - backend_static:/var/www/static:ro
      - backend_media:/var/www/media:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - ibs_network

# ============================================================
# VOLUMES
# ============================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_media:
    driver: local
  backend_static:
    driver: local
  backend_logs:
    driver: local
  ai_models:
    driver: local

# ============================================================
# NETWORKS
# ============================================================
networks:
  ibs_network:
    driver: bridge