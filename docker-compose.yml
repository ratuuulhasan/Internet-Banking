version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: internet_banking
      POSTGRES_USER: bank_admin
      POSTGRES_PASSWORD: BankAdmin@2024
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application -b 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      AI_SERVICE_URL: http://ai:9000

  ai:
    build: ./ai-service
    command: uvicorn app:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata: